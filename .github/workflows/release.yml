name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.6.4)
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: 校验 tag 与版本号一致
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          tag_version="${tag#v}"

          cargo_version="$(sed -nE 's/^version = "([^"]+)".*$/\1/p' Cargo.toml | head -n 1)"

          echo "tag       : $tag"
          echo "Cargo.toml: $cargo_version"

          if [[ -z "$cargo_version" ]]; then
            echo "读不到版本号" >&2; exit 1
          fi
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "tag '$tag' 与 Cargo.toml 版本 '$cargo_version' 不一致。请打 v$cargo_version" >&2
            exit 1
          fi

          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "RETYPE_VERSION=$cargo_version" >> "$GITHUB_ENV"

      # ── 2. 发布说明必须存在（缺了就失败，不要发一个空说明的 release）──────
      - name: 校验发布说明存在
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${{ steps.version.outputs.tag }}.md"
          if [[ ! -f "$notes" ]]; then
            echo "缺少发布说明: $notes" >&2
            echo "发布前请先写好这个文件（参考 docs/releases/ 下的既有文件）" >&2
            exit 1
          fi
          echo "发布说明: $notes"


  build:
    needs: metadata
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      register-tip: true
      source-ref: ${{ needs.metadata.outputs.tag }}

  publish:
    name: Publish validated installer
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: .
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.tag }}
          body_path: docs/releases/${{ needs.metadata.outputs.tag }}.md
          files: |
            dist/*-setup.exe
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false

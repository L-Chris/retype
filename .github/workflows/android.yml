name: Android preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['platforms/android/**', 'platforms/windows/ai/**', 'platforms/windows/sync/**', 'platforms/windows/learning/**', 'core/**', 'tools/dict-build/**', 'apps/settings-egui/dictionary-packs.json', 'Cargo.toml', 'Cargo.lock', 'data/dict/raw/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['platforms/android/**', 'platforms/windows/ai/**', 'platforms/windows/sync/**', 'platforms/windows/learning/**', 'core/**', 'tools/dict-build/**', 'apps/settings-egui/dictionary-packs.json', 'Cargo.toml', 'Cargo.lock', 'data/dict/raw/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'platforms/android/**/*.gradle.kts'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: SDK and native tooling
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          cargo install cargo-ndk --locked
      - name: Session regression tests and offline dictionary
        run: |
          cargo test --locked -p retype-android -p retype-ai -p retype-dict-build --features retype-ai/service
          cargo run --locked --release -p retype-dict-build -- --out data/dict/retype-dict.tsv
      - name: JNI libraries
        env:
          RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a -t x86_64 -p 26 -o platforms/android/build/native build --locked --release -p retype-android
      - name: Build and lint
        working-directory: platforms/android
        run: bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: retype-android-preview
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

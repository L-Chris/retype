[package]
name = "retype-sync-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
retype-types = { workspace = true, features = ["serde"] }
retype-ai-core = { path = "../ai" }
retype-learning-store = { path = "../learning" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }
xml-rs = "0.8"
base64 = "0.22"
png = "0.17"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
spake2 = "0.4"
hmac = "0.12"
sha2-pairing = { package = "sha2", version = "0.10" }

[lints]
workspace = true

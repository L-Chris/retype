[package]
name = "retype-updater-cli"
description = "retype-updater.exe：独立的更新检查/下载工具（TIP DLL 绝不做网络 IO）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "retype-updater"
path = "src/main.rs"

[[bin]]
name = "retype-update-launcher"
path = "src/launcher.rs"

[dependencies]
retype-updater = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Registry", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security"] }

[lints]
workspace = true

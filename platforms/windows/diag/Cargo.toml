[package]
name = "retype-diag"
description = "终端调试台：不碰 TSF 就能验证内核、词库与二刷链路（docs/windows-tsf.md 开发回路）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "retype-diag"
path = "src/main.rs"

[features]
candidate-benchmark = ["retype-candidate-ui/egui"]

[[example]]
name = "typing-latency"
required-features = ["candidate-benchmark"]

[dependencies]
retype-types = { workspace = true }
retype-pinyin = { workspace = true }
retype-dict = { workspace = true }
retype-context = { workspace = true }
retype-cloud = { workspace = true }
retype-engine = { workspace = true }
retype-candidate-ui = { path = "../candidate-ui" }

[lints]
workspace = true

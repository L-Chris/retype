[package]
name = "retype-sync"
description = "Per-user cloud and LAN clipboard synchronization outside input host processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
retype-ai = { path = "../ai" }
retype-learning = { path = "../learning" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }
xml-rs = "0.8"
base64 = "0.22"
spake2 = "0.4"
hmac = "0.12"
sha2-pairing = { package = "sha2", version = "0.10" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
mdns-sd = "0.21"
if-addrs = "0.15"

[[bin]]
name = "retype-sync-host"
path = "src/main.rs"

[lints]
workspace = true

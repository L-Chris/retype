[package]
name = "retype-sync"
description = "Per-user cloud and LAN clipboard synchronization outside input host processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
retype-sync-core = { path = "../../../core/sync" }
retype-ai = { path = "../ai" }
retype-learning = { path = "../learning" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
fs2 = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
mdns-sd = "0.21"
if-addrs = "0.15"
socket2 = "0.6"

[[bin]]
name = "retype-sync-host"
path = "src/main.rs"

[lints]
workspace = true

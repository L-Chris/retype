[package]
name = "retype-learning"
description = "Asynchronous shared user learning and its per-user Windows broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
broker = ["dep:rusqlite", "retype-learning-store/sqlite"]

[[bin]]
name = "retype-learning-host"
path = "src/main.rs"
required-features = ["broker"]

[dependencies]
retype-learning-store = { path = "../../../core/learning" }
retype-dict.workspace = true
retype-pinyin.workspace = true
retype-types.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "backup"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation",
    "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes",
    "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Registry",
] }

[lints]
workspace = true

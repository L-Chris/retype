[package]
name = "retype-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
service = ["retype-ai-core/service"]

[dependencies]
retype-ai-core = { path = "../../../core/ai" }
serde_json.workspace = true
retype-learning = { path = "../learning" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Registry", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_Media_Audio"] }

[[bin]]
name = "retype-ai-host"
path = "src/main.rs"
required-features = ["service"]

[lints]
workspace = true

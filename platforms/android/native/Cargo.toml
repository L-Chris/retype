[package]
name = "retype-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "retype_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
retype-services = { path = "../../../core/services" }
retype-engine.workspace = true
retype-dict.workspace = true
retype-pinyin.workspace = true
retype-types.workspace = true
retype-english.workspace = true
retype-resources = { path = "../../../core/resources" }
retype-learning-store = { path = "../../../core/learning", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
base64 = "0.22"
retype-ai = { package = "retype-ai-core", path = "../../../core/ai", features = ["service"] }
retype-sync = { package = "retype-sync-core", path = "../../../core/sync" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[lints]
workspace = true

[dev-dependencies]
retype-english = { path = "../../../core/english", features = ["test-data"] }
